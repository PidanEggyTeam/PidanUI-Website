name: Lint & Build

# 代码守门：ESLint（可能出错的地方）→ 构建校验
#
# 触发来源：
#   pull_request      —— 所有 PR（含 fork 发起的）都跑一次
#   push              —— 所有分支推送（含 main）都跑，部署前先过这一关
#   workflow_dispatch —— 需要手动重跑时
#
# 部署已改为 Cloudflare Workers（维护者本地执行 `pnpm deploy`），仓库里不再有
# GitHub Pages 部署流水线；构建校验因此挂在这里，保证「检查不过就不该发版」。
#
# 排版检查（Prettier）已拆到独立的 prettier.yml，两者互不阻塞。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ESLint + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ESLint 先跑：任何 lint 报错都会让本 job 直接失败，
      # 后续 Build 步骤因此不会被触发（无需额外 if 条件）
      - name: ESLint
        run: pnpm run lint

      # 构建同时验证预渲染：failOnError 下任何缺页都会让这一步失败
      - name: Build
        run: pnpm run build
